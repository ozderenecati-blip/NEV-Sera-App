<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/NEV-Sera-App/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NEV Seracılık - Kasa ve Finans Yönetimi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEV Sera">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NEV Seracılık</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#059669,#047857,#065F46);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
    <div style="width:80px;height:80px;border-radius:20px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
      <span style="font-size:40px;">🌱</span>
    </div>
    <div style="color:white;font-size:22px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin-bottom:8px;">NEV Seracılık</div>
    <div style="color:rgba(255,255,255,0.7);font-size:13px;font-family:-apple-system,sans-serif;">Yükleniyor...</div>
    <div style="margin-top:24px;width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top:3px solid white;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <!-- Yeni surum bildirimi -->
  <div id="update-banner" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#065F46;color:white;padding:12px 20px;border-radius:12px;z-index:10000;box-shadow:0 4px 16px rgba(0,0,0,0.3);align-items:center;gap:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;">
    <span>Yeni s&#252;r&#252;m haz&#305;r</span>
    <button id="update-btn" style="background:white;color:#065F46;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;">Yenile</button>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) splash.style.display = 'none';
    });

    // Yeni surum kontrolu: version.json + buildNumber degisince banner goster
    // (Flutter'in service worker'i kaldirildigi icin HTTP onbellek + ETag kullanilir)
    (function() {
      var currentVersion = null;

      function fetchVersion() {
        return fetch('version.json?ts=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function() { return null; });
      }

      function checkForUpdate() {
        fetchVersion().then(function(v) {
          if (!v) return;
          var tag = (v.version || '') + '+' + (v.build_number || '');
          if (currentVersion === null) { currentVersion = tag; return; }
          if (tag !== currentVersion) {
            var banner = document.getElementById('update-banner');
            if (banner) banner.style.display = 'flex';
          }
        });
      }

      document.getElementById('update-btn').onclick = function() {
        this.disabled = true;
        location.reload();
      };

      window.addEventListener('load', function() {
        checkForUpdate(); // ilk deger kaydi
        setInterval(checkForUpdate, 5 * 60 * 1000); // 5 dakikada bir kontrol
        // Uygulama arka plandan one gelince de kontrol et (mobil icin)
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
